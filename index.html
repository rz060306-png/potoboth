<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zeetsnapphotobooth</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-gray-700 min-h-screen flex flex-col justify-between antialiased selection:bg-rose-100 selection:text-rose-800">

    <!-- Header -->
    <header class="py-3 md:py-4 text-center bg-white/80 backdrop-blur-md shadow-xs sticky top-0 z-50 px-4 border-b border-stone-200/60">
        <h1 class="text-xl md:text-2xl font-bold tracking-wider text-stone-800">ZEETSNAP 
        <p class="text-[10px] md:text-xs text-stone-400 mt-0.5">Bikin momen biasa jadi luar biasa</p>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-4 w-full grid grid-cols-1 lg:grid-cols-12 gap-6 items-start my-auto">
        
        <!-- KIRI: Kontrol & Kamera (7 Kolom) -->
        <section class="lg:col-span-7 bg-white p-4 md:p-6 rounded-2xl shadow-xs border border-stone-200/70 flex flex-col gap-5">
            
            <!-- Viewport Kamera -->
            <div class="relative aspect-[4/3] w-full bg-stone-900 rounded-xl overflow-hidden border border-stone-200 shadow-inner group">
                <video id="video" class="w-full h-full filter-normal object-cover" autoplay playsinline></video>
                
                <!-- Overlay Elements -->
                <div id="countdown" class="absolute inset-0 flex items-center justify-center text-7xl font-extrabold text-white bg-black/40 backdrop-blur-xs hidden transition-all">3</div>
                <div id="flash" class="absolute inset-0 bg-white hidden z-40"></div>
                
                <!-- Badge Status Slot -->
                <div class="absolute bottom-3 left-3 bg-black/60 text-white px-3 py-1 rounded-full text-[11px] font-medium backdrop-blur-md border border-white/10 flex items-center gap-1.5 z-30">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    Slot: <span id="photo-index" class="text-amber-300 font-bold">0</span> / <span id="total-slots-text">4</span>
                </div>
            </div>

            <!-- Pengaturan Sesi & Timer -->
            <div class="grid grid-cols-2 gap-3 bg-stone-50 p-3 rounded-xl border border-stone-100">
                <div>
                    <label class="text-[11px] font-semibold text-stone-500 uppercase tracking-wider block mb-1">Jumlah Foto</label>
                    <select id="layout-select" class="w-full text-xs bg-white border border-stone-200 rounded-lg p-2 font-medium focus:ring-1 focus:ring-stone-400 outline-none">
                        <option value="4">4 Foto </option>
                        <option value="3">3 Foto </option>
                        <option value="2">2 Foto </option>
                    </select>
                </div>
                <div>
                    <label class="text-[11px] font-semibold text-stone-500 uppercase tracking-wider block mb-1">Jeda Timer</label>
                    <select id="timer-select" class="w-full text-xs bg-white border border-stone-200 rounded-lg p-2 font-medium focus:ring-1 focus:ring-stone-400 outline-none">
                        <option value="3">3 Detik </option>
                        <option value="5" selected>5 Detik </option>
                        <option value="8">8 Detik </option>
                    </select>
                </div>
            </div>

            <!-- Pilihan Filter & Efek Spesial -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold text-stone-400 uppercase tracking-wider">Filter Preset</span>
                    <div class="flex gap-3 text-xs">
                        <label class="flex items-center gap-1 cursor-pointer select-none text-[11px]">
                        </label>
                        <label class="flex items-center gap-1 cursor-pointer select-none text-[11px]">
                        </label>
                    </div>
                </div>
                <div class="grid grid-cols-5 gap-1.5">
                    <button data-filter="filter-normal" class="btn-filter filter-active py-2 text-[11px] font-medium rounded-lg border bg-stone-50 hover:bg-stone-100 transition">Normal</button>
                    <button data-filter="filter-vintage" class="btn-filter py-2 text-[11px] font-medium rounded-lg border bg-amber-50/40 text-amber-900 hover:bg-amber-50 transition">Vintage</button>
                    <button data-filter="filter-bw" class="btn-filter py-2 text-[11px] font-medium rounded-lg border bg-stone-100 text-stone-800 hover:bg-stone-200 transition">B&W</button>
                    <button data-filter="filter-warm" class="btn-filter py-2 text-[11px] font-medium rounded-lg border bg-orange-50/40 text-orange-900 hover:bg-orange-50 transition">Warm</button>
                    <button data-filter="filter-cool" class="btn-filter py-2 text-[11px] font-medium rounded-lg border bg-blue-50/40 text-blue-900 hover:bg-blue-50 transition">Cool</button>
                </div>
            </div>

            <!-- Custom Text Input -->
            <div>
                <label class="text-xs font-semibold text-stone-400 uppercase tracking-wider block mb-1.5">Teks Kustom Frame</label>
                <input type="text" id="custom-text-input" placeholder="Tuliskan sesuai keinginan mu" maxlength="25" class="w-full text-xs border border-stone-200 rounded-xl p-2.5 bg-stone-50 focus:bg-white focus:ring-1 focus:ring-stone-400 outline-none transition">
            </div>

            <!-- Pilihan Frame Aesthetic -->
            <div>
                <span class="text-xs font-semibold text-stone-400 uppercase tracking-wider block mb-2">Warna Frame</span>
                <div class="grid grid-cols-3 sm:grid-cols-4 gap-2 max-h-[160px] overflow-y-auto pr-1 custom-scrollbar">
                    <button data-color="#ffffff" data-footer="Memorable Day" class="btn-frame frame-active p-2 text-[11px] font-medium rounded-xl border border-stone-200 bg-white flex items-center gap-2 hover:border-stone-400 transition text-left">
                        <div class="w-5 h-5 rounded-full bg-white border border-stone-300 shadow-xs shrink-0"></div>
                        <span class="truncate">White</span>
                    </button>
                    <button data-color="#fecdd3" data-footer="Sakura Blossom" class="btn-frame p-2 text-[11px] font-medium rounded-xl border border-transparent bg-rose-50 text-rose-700 flex items-center gap-2 hover:bg-rose-100 transition text-left">
                        <div class="w-5 h-5 rounded-full bg-rose-300 shrink-0"></div>
                        <span class="truncate">Sakura</span>
                    </button>
                    <button data-color="#fef3c7" data-footer="Retro Butter" class="btn-frame p-2 text-[11px] font-medium rounded-xl border border-transparent bg-amber-50 text-amber-700 flex items-center gap-2 hover:bg-amber-100 transition text-left">
                        <div class="w-5 h-5 rounded-full bg-amber-300 shrink-0"></div>
                        <span class="truncate">Butter</span>
                    </button>
                    <button data-color="#d1fae5" data-footer="Matcha Latte" class="btn-frame p-2 text-[11px] font-medium rounded-xl border border-transparent bg-emerald-50 text-emerald-800 flex items-center gap-2 hover:bg-emerald-100 transition text-left">
                        <div class="w-5 h-5 rounded-full bg-emerald-300 shrink-0"></div>
                        <span class="truncate">Matcha</span>
                    </button>
                    <button data-color="#1e293b" data-footer="Midnight Sky" class="btn-frame p-2 text-[11px] font-medium rounded-xl border border-transparent bg-slate-800 text-slate-200 flex items-center gap-2 hover:bg-slate-700 transition text-left">
                        <div class="w-5 h-5 rounded-full bg-slate-900 border border-slate-700 shrink-0"></div>
                        <span class="truncate">Dark</span>
                    </button>
                    <button data-color="#ffedd5" data-footer="Sweet Peach" class="btn-frame p-2 text-[11px] font-medium rounded-xl border border-transparent bg-orange-50 text-orange-700 flex items-center gap-2 hover:bg-orange-100 transition text-left">
                        <div class="w-5 h-5 rounded-full bg-orange-300 shrink-0"></div>
                        <span class="truncate">Peach</span>
                    </button>
                    <button data-color="#f5eae0" data-footer="Cozy Choco" class="btn-frame p-2 text-[11px] font-medium rounded-xl border border-transparent bg-stone-100 text-amber-900 flex items-center gap-2 hover:bg-stone-200 transition text-left">
                        <div class="w-5 h-5 rounded-full bg-[#e7d7c9] shrink-0"></div>
                        <span class="truncate">Choco</span>
                    </button>
                    <button data-color="#fae8ff" data-footer="Lilac Clouds" class="btn-frame p-2 text-[11px] font-medium rounded-xl border border-transparent bg-fuchsia-50 text-fuchsia-700 flex items-center gap-2 hover:bg-fuchsia-100 transition text-left">
                        <div class="w-5 h-5 rounded-full bg-fuchsia-300 shrink-0"></div>
                        <span class="truncate">Lilac</span>
                    </button>
                </div>
            </div>

            <!-- Tombol Aksi -->
            <div class="flex gap-2 mt-1">
                <button id="start-btn" class="flex-1 py-3 bg-stone-800 hover:bg-stone-900 text-white font-medium text-sm rounded-xl shadow-md transition active:scale-[0.99] flex items-center justify-center gap-2">
                    <span></span> Mulai Foto
                </button>
                <button id="reset-btn" class="px-4 py-3 bg-stone-100 text-stone-600 text-xs font-semibold rounded-xl hover:bg-stone-200 transition active:scale-95">
                    Reset
                </button>
            </div>
        </section>

        <!-- KANAN: Pratinjau Strip (5 Kolom) -->
        <section class="lg:col-span-5 flex flex-col items-center w-full sticky top-20">
            <span class="text-xs font-semibold text-stone-400 uppercase tracking-wider mb-3">Pratinjau Hasil Strip</span>
            
            <div class="responsive-strip-container w-full flex justify-center">
                <!-- Strip Box -->
                <div id="booth-strip" class="w-[240px] p-4 bg-white shadow-2xl rounded-sm flex flex-col gap-3 transition-all duration-300 relative overflow-hidden border border-stone-200/60 select-none">
                    
                    <!-- Slot Foto Grid Dynamic -->
                    <div id="photo-slots-container" class="grid grid-cols-1 gap-3 z-0">
                        <div class="aspect-[4/3] bg-stone-100 rounded-xs overflow-hidden border border-stone-200/30 relative">
                            <canvas id="canvas-1" class="w-full h-full captured-frame hidden"></canvas>
                        </div>
                        <div class="aspect-[4/3] bg-stone-100 rounded-xs overflow-hidden border border-stone-200/30 relative">
                            <canvas id="canvas-2" class="w-full h-full captured-frame hidden"></canvas>
                        </div>
                        <div class="aspect-[4/3] bg-stone-100 rounded-xs overflow-hidden border border-stone-200/30 relative">
                            <canvas id="canvas-3" class="w-full h-full captured-frame hidden"></canvas>
                        </div>
                        <div class="aspect-[4/3] bg-stone-100 rounded-xs overflow-hidden border border-stone-200/30 relative">
                            <canvas id="canvas-4" class="w-full h-full captured-frame hidden"></canvas>
                        </div>
                    </div>

                    <!-- Footer Teks -->
                    <div class="text-center py-1 mt-0.5 z-20">
                        <p class="text-[10px] uppercase tracking-widest text-stone-500 font-semibold transition-colors" id="strip-footer-text">Memorable Day</p>
                        <p class="text-[7px] text-stone-400 tracking-wider mt-0.5" id="strip-date-text"></p>
                    </div>
                </div>
            </div>

            <!-- Tombol Download -->
            <button id="download-btn" disabled class="mt-4 w-full max-w-[240px] py-3.5 bg-stone-800 text-white text-xs font-semibold tracking-wide rounded-xl shadow-md hover:bg-stone-900 disabled:bg-stone-200 disabled:text-stone-400 disabled:shadow-none disabled:cursor-not-allowed transition flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Unduh Hasil 
            </button>
        </section>
    </main>

    <!-- Footer -->
    <footer class="py-3 text-center text-[10px] text-stone-400 bg-white/50 border-t border-stone-200/50 mt-6">
        &copy; 2026 Zeetsnapphotobooth. All Rights Reserved.
    </footer>

    <!-- Script Utama -->
    <script src="script.js"></script>
</body>
</html>
